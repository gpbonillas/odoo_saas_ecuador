# PostgreSQL 16 — PRODUCTION tuning for Odoo at scale (millions of txns)
# Baseline: dedicated container, 8+ GB RAM for the DB layer. Adjust via command-line overrides in compose.
listen_addresses = '*'
port = 5432
max_connections = 60                     # clúster tope 8G: 4 workers + cron + admin
superuser_reserved_connections = 3

# ---- Memory (tuned to the 3G container cap: CLÚSTER TOPE 8G) -------
shared_buffers = 1GB                     # ~33% del contenedor de 3G
effective_cache_size = 2GB
maintenance_work_mem = 256MB
work_mem = 16MB                          # sort/hash bajo tope de 3G
huge_pages = try

# ---- WAL / durability ----------------------------------------------
wal_level = logical
max_wal_size = 4GB
min_wal_size = 1GB
checkpoint_completion_target = 0.9
wal_buffers = 64MB
synchronous_commit = on                  # NEVER off: SRI/e-invoice auditability
fsync = on
full_page_writes = on

# ---- Query planner --------------------------------------------------
random_page_cost = 1.1                   # SSD/NVMe
effective_io_concurrency = 200
default_statistics_target = 500          # Odoo's large JOINs benefit
jit = on

# ---- Autovacuum (bloat control under heavy load) --------------------
autovacuum = on
autovacuum_max_workers = 6
autovacuum_naptime = 30s
autovacuum_vacuum_threshold = 50
autovacuum_analyze_threshold = 50
autovacuum_vacuum_scale_factor = 0.01
autovacuum_analyze_scale_factor = 0.005
autovacuum_vacuum_cost_delay = 2ms
autovacuum_vacuum_cost_limit = 1000

# ---- Logging (audit trail) -----------------------------------------
log_destination = 'stderr'
logging_collector = on
log_directory = '/var/log/postgresql'
log_filename = 'postgresql-%Y-%m-%d.log'
log_min_duration_statement = 250ms       # slow-query capture
log_checkpoints = on
log_connections = on
log_disconnections = on
log_lock_waits = on
log_temp_files = 0
log_autovacuum_min_duration = 0
log_line_prefix = '%m [%p] %q%u@%d '

# ---- Locale / timezone ---------------------------------------------
datestyle = 'iso, mdy'
timezone = 'America/Guayaquil'
lc_messages = 'en_US.UTF-8'
